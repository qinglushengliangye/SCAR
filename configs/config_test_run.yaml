# Quick test config - trains from DeBERTa backbone only (no GLiREL pretraining)
# Use this to verify training pipeline works while waiting for GLiREL model download

# Learning Rate
lr_encoder: 1e-5
lr_others: 1e-4
weight_decay_encoder: 0.0
weight_decay_other: 0.0

# Training Parameters  
num_steps: 30         # just a quick test
warmup_ratio: 0.1
train_batch_size: 4
eval_every: 15
gradient_accumulation: null
eval_batch_size: 16
num_layers_freeze: null
early_stopping_patience: 100
early_stopping_delta: 0.0
threshold_search_metric: "macro_f1"
max_saves: 1

# Model Configuration
max_width: 12
model_name: /root/autodl-tmp/models/deberta-v3-large
fine_tune: true
subtoken_pooling: first
hidden_size: 768
scorer: "dot"
rel_mode: marker
span_marker_mode: markerv1
refine_prompt: false
refine_relation: false
ffn_mul: 4
dropout: 0.4
scheduler: "cosine_with_warmup"
loss_func: "binary_cross_entropy_loss"
alpha: 0.75
gamma: 3
label_embed_strategy: "both"

# Coreference Resolution
coref_classifier: false
coref_loss_weight: 10.0
coreference_label: "SELF"

# Entity markers
entity_start_token: "[E]"
entity_end_token: "[/E]"

# Directory Paths
dataset_name: "few_rel"
root_dir: logs_repro
train_data: "data/few_rel_all.jsonl"

# No pretrained GLiREL - just DeBERTa backbone
prev_path: none

# Training Specifics
size_sup: -1
num_train_rel_types: 25
num_unseen_rel_types: 15
top_k: 1
random_drop: true
max_len: 128    # shorter for quick test
eval_threshold:
  - 0.1
  - 0.3
max_entity_pair_distance: null
fixed_relation_types: true

name: "test"
