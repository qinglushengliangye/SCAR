# ============================================================
# ISCL 消融实验：去除交叉注意力 - FewRel 数据集
# 基于 config_few_rel_innovation2_exp1.yaml (与 innovation2_exp4 同 seed=11223344)
# 唯一改动：supcon_cross_attention: false
# ============================================================

# Learning Rate
lr_encoder: 1e-5
lr_others: 1e-4
weight_decay_encoder: 0.0
weight_decay_other: 0.0

# Training Parameters
num_steps: 20000
warmup_ratio: 0.1
train_batch_size: 32
eval_every: 300
gradient_accumulation: null
eval_batch_size: 64
num_layers_freeze: null
early_stopping_patience: 12
early_stopping_delta: 0.0
threshold_search_metric: "macro_f1"
max_saves: 1

# Model Configuration
max_width: 12
model_name: /root/autodl-tmp/models/deberta-v3-large
fine_tune: true
subtoken_pooling: first
hidden_size: 768
scorer: "dot"
rel_mode: marker
span_marker_mode: markerv1
refine_prompt: false
refine_relation: false
ffn_mul: 4
dropout: 0.4
scheduler: "cosine_with_warmup"
loss_func: "binary_cross_entropy_loss"
alpha: 0.75
gamma: 3
label_embed_strategy: "both"

# Coreference Resolution
coref_classifier: false
coref_loss_weight: 10.0
coreference_label: "SELF"

# Entity markers
entity_start_token: "[E]"
entity_end_token: "[/E]"

# Directory Paths
dataset_name: "few_rel"
root_dir: logs_ablation_iscl
train_data: "data/few_rel_all.jsonl"

# Pretrained GLiREL model as starting point
prev_path: /root/autodl-tmp/models/glirel-large-v0

# Training Specifics
size_sup: -1
num_train_rel_types: 25
num_unseen_rel_types: 15
top_k: 1
random_drop: true
max_len: 512
eval_threshold:
  - 0.01
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  - 0.6
max_entity_pair_distance: null
fixed_relation_types: true

name: "large_innovation2"

positive_weight: 2.0
negative_weight: 1.0

# ============================================================
# 创新点1：双编码器粗细粒度软融合
# ============================================================
cascade_retrieval: true
retrieval_dim: 256
fusion_alpha_init: 0.0
fusion_alpha_max: 0.5
cascade_warmup_steps: 1000
retrieval_loss_weight: 0.05

# ============================================================
# 创新点2：交互式特征提取 + 有监督对比学习
# ============================================================
supcon_enabled: true
supcon_proj_dim: 128
supcon_temperature: 0.1
supcon_hard_neg_beta: 1.0
supcon_warmup_steps: 1500
supcon_loss_weight: 0.05

# ============================================================
# 消融：禁用交叉注意力（直接将实体对表示送入投影头）
# ============================================================
supcon_cross_attention: false

seed: 11222333
