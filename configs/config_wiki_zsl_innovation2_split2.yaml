# ============================================================
# 创新点2 第二组数据划分实验 - Wiki-ZSL
# 目标：验证创新点2在不同 train/eval 关系划分下的稳定性
# 与主实验唯一不同之处：seed（决定 15 个 unseen 关系的随机选择）
# ============================================================

# Learning Rate
lr_encoder: 2e-6
lr_others: 2e-5
weight_decay_encoder: 0.0
weight_decay_other: 0.0

# Training Parameters
num_steps: 20000
warmup_ratio: 0.03
train_batch_size: 24
eval_every: 300
gradient_accumulation: null
eval_batch_size: 48
num_layers_freeze: null
early_stopping_patience: 12
early_stopping_delta: 0.0
threshold_search_metric: "macro_f1"
max_saves: 1

# Model Configuration
max_width: 12
model_name: /root/autodl-tmp/models/deberta-v3-large
fine_tune: true
subtoken_pooling: first
hidden_size: 768
scorer: "dot"
rel_mode: marker
span_marker_mode: markerv1
refine_prompt: false
refine_relation: false
ffn_mul: 4
dropout: 0.4
scheduler: "cosine_with_warmup"
loss_func: "binary_cross_entropy_loss"
alpha: 0.3
gamma: 3
label_embed_strategy: "both"

# Coreference Resolution
coref_classifier: false
coref_loss_weight: 10.0
coreference_label: "SELF"

# Entity markers
entity_start_token: "[E]"
entity_end_token: "[/E]"

# Directory Paths
dataset_name: "wiki_zsl"
root_dir: logs_innovation2_split2
train_data: "data/wiki_zsl_all.jsonl"

# Pretrained GLiREL model as starting point
# 注意：对新数据划分使用 glirel-large-v0（不使用 exp5 checkpoint，
# 因为 exp5 checkpoint 是针对 seed=55667788 的数据划分训练的，
# 换数据划分后 unseen 关系不同，需从通用预训练权重开始）
prev_path: /root/autodl-tmp/models/glirel-large-v0

# Training Specifics
size_sup: -1
num_train_rel_types: 25
num_unseen_rel_types: 15
top_k: 1
random_drop: true
max_len: 512
eval_threshold:
  - 0.01
  - 0.05
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  - 0.6
max_entity_pair_distance: null
fixed_relation_types: true

name: "large_innovation2_split2"

positive_weight: 2.0
negative_weight: 1.0

# ============================================================
# 创新点1：双编码器粗细粒度软融合
# ============================================================
cascade_retrieval: true
retrieval_dim: 128
fusion_alpha_init: 0.0
fusion_alpha_max: 0.05
cascade_warmup_steps: 3000
retrieval_loss_weight: 0.01

# ============================================================
# 创新点2：交互式特征提取 + 有监督对比学习
# ============================================================
supcon_enabled: true
supcon_proj_dim: 128
supcon_temperature: 0.1
supcon_hard_neg_beta: 1.0
supcon_warmup_steps: 1500
supcon_loss_weight: 0.05

# 不同的随机种子 → 不同的 15 个 unseen 关系 → 不同的 train/eval 划分
seed: 11223344
